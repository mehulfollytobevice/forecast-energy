[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pjm-forecasting"
version = "0.1.0"
description = "End-to-end hourly load forecasting for the full PJM region: hierarchical quantile models, point-in-time weather, and a live dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mehul Jain" }]
keywords = [
  "energy",
  "forecasting",
  "PJM",
  "OpenSTEF",
  "Open-Meteo",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.3.1,<4",
  "pyarrow>=21",
  "numpy>=2.3.2,<3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "prefect>=3.8.8,<4",
  "openstef[beam]==4.4.8",
  "mlflow>=3,<4",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "pre-commit>=3.5",
]
notebooks = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.10,<4",
  "plotly>=6.3,<7",
]
dashboard = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/mehulfollytobevice/forecast-energy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "network: live read of a public weather or load API",
    "openstef: fits or backtests an OpenSTEF model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
